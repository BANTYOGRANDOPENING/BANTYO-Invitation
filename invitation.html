<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitation Letter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Georgia", "Times New Roman", serif;
      overflow: hidden;
      position: relative;
    }

    /* Background particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 215, 0, 0.6);
      border-radius: 50%;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
    }

    /* ===== ENVELOPE STAGE ===== */
    #envelope-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #envelope-stage.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
    }

    .hint {
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .envelope {
      width: 320px;
      height: 200px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
    }

    .envelope:hover {
      transform: scale(1.05) translateY(-5px);
    }

    .envelope:active {
      transform: scale(0.98);
    }

    /* Envelope body */
    .env-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(180deg, #f5e6c8 0%, #e8d5a8 100%);
      border-radius: 0 0 8px 8px;
      border: 2px solid #c9a86c;
      overflow: hidden;
    }

    .env-body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(180deg, rgba(201,168,108,0.3) 0%, transparent 100%);
    }

    /* Envelope flap */
    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(180deg, #d4b87a 0%, #c9a86c 100%);
      clip-path: polygon(0 0, 50% 70%, 100% 0);
      border: 2px solid #b8955a;
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .envelope.open .env-flap {
      transform: rotateX(180deg);
    }

    /* Wax seal */
    .seal {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      background: radial-gradient(circle at 35% 35%, #e74c3c, #c0392b);
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .seal::after {
      content: "✉";
      font-size: 22px;
      color: rgba(255,255,255,0.9);
    }

    .envelope.open .seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.5);
    }

    /* Decorative lines on body */
    .env-line {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 1px;
      background: rgba(201,168,108,0.5);
    }
    .env-line:nth-child(1) { top: 30px; }
    .env-line:nth-child(2) { top: 50px; }
    .env-line:nth-child(3) { top: 70px; }

    /* ===== VIDEO STAGE ===== */
    #video-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
      width: 90%;
      max-width: 800px;
    }

    #video-stage.active {
      display: flex;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 2px solid rgba(255,215,0,0.3);
      aspect-ratio: 4 / 3;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .countdown {
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.4);
      padding: 8px 20px;
      border-radius: 20px;
    }

    /* ===== LETTER STAGE ===== */
    #letter-stage {
      display: none;
      z-index: 20;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.8s ease;
    }

    #letter-stage.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .letter {
      background: linear-gradient(180deg, #fffef5 0%, #f8f0e0 100%);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 48px 40px;
      border-radius: 4px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(201,168,108,0.4);
      position: relative;
      animation: letterPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes letterPop {
      from { transform: scale(0.6) translateY(40px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .letter::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(201,168,108,0.35);
      pointer-events: none;
    }

    .letter-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .letter-header .ornament {
      font-size: 1.8rem;
      color: #c9a86c;
      margin-bottom: 8px;
    }

    .letter-header h1 {
      font-size: 1.6rem;
      color: #5c4033;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .letter-body {
      color: #4a3728;
      font-size: 1.05rem;
      line-height: 1.85;
      text-align: center;
    }

    .letter-body p {
      margin-bottom: 16px;
    }

    .letter-body .highlight {
      color: #8b4513;
      font-weight: bold;
      font-size: 1.15rem;
    }

    .letter-footer {
      margin-top: 32px;
      text-align: center;
      color: #7a5c45;
      font-style: italic;
      font-size: 0.95rem;
    }

    .letter-footer .signature {
      margin-top: 12px;
      font-size: 1.3rem;
      color: #5c4033;
      font-style: normal;
      font-family: "Brush Script MT", "Segoe Script", cursive;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .envelope {
        width: 280px;
        height: 175px;
      }
      .env-body {
        height: 120px;
      }
      .letter {
        padding: 32px 24px;
      }
      .letter-header h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <!-- Decorative particles -->
  <div class="particle" style="top:10%; left:15%; animation-delay:0s;"></div>
  <div class="particle" style="top:25%; left:80%; animation-delay:1.5s;"></div>
  <div class="particle" style="top:60%; left:10%; animation-delay:3s;"></div>
  <div class="particle" style="top:75%; left:70%; animation-delay:2s;"></div>
  <div class="particle" style="top:40%; left:90%; animation-delay:4s;"></div>
  <div class="particle" style="top:85%; left:40%; animation-delay:1s;"></div>

  <!-- ===== STAGE 1: Envelope ===== -->
  <div id="envelope-stage">
    <p class="hint">點擊信封打開邀請函</p>
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="env-flap"></div>
      <div class="seal"></div>
      <div class="env-body">
        <div class="env-line"></div>
        <div class="env-line"></div>
        <div class="env-line"></div>
      </div>
    </div>
  </div>

  <!-- ===== STAGE 2: Video ===== -->
  <div id="video-stage">
    <div class="video-wrapper">
      <video id="player" playsinline></video>
    </div>
    <div class="countdown" id="countdown">正在播放… 10 秒後顯示邀請信</div>
  </div>

  <!-- ===== STAGE 3: Letter ===== -->
  <div id="letter-stage">
    <div class="letter">
      <div class="letter-header">
        <div class="ornament">✦ ◆ ✦</div>
        <h1>邀請函</h1>
      </div>
      <div class="letter-body">
        <p>親愛的朋友，</p>
        <p>誠意邀請你參加一場特別的聚會。</p>
        <p class="highlight">【活動詳情待定】</p>
        <p>日期：待定<br>
           時間：待定<br>
           地點：待定</p>
        <p>期待與你見面！</p>
      </div>
      <div class="letter-footer">
        <p>此致</p>
        <p class="signature">敬上</p>
      </div>
    </div>
  </div>

  <script>
    const PLAY_SECONDS = 10;
    let countdownInterval = null;
    let videoEnded = false;

    function openEnvelope() {
      const envelope = document.getElementById("envelope");
      envelope.classList.add("open");

      // Wait for flap animation, then switch stages
      setTimeout(() => {
        document.getElementById("envelope-stage").classList.add("hidden");
        startVideo();
      }, 900);
    }

    function startVideo() {
      const videoStage = document.getElementById("video-stage");
      videoStage.classList.add("active");

      const video = document.getElementById("player");
      // Use relative path so it works when both files are in the same folder
      video.src = "braveheart_10s.mp4";
      video.muted = false;
      video.playsInline = true;

      video.onloadeddata = function () {
        video.play().catch(function () {
          // Autoplay may be blocked; still start countdown and show letter later
          startCountdown();
        });
        startCountdown();
      };

      video.onended = function () {
        showLetter();
      };

      // Fallback if load fails
      video.onerror = function () {
        document.getElementById("countdown").textContent = "影片載入失敗，即將顯示邀請信…";
        setTimeout(showLetter, 1500);
      };
    }

    function startCountdown() {
      if (countdownInterval) return;
      let remaining = PLAY_SECONDS;
      const countdownEl = document.getElementById("countdown");
      countdownEl.textContent = `正在播放… ${remaining} 秒後顯示邀請信`;

      countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          showLetter();
        } else {
          countdownEl.textContent = `正在播放… ${remaining} 秒後顯示邀請信`;
        }
      }, 1000);
    }

    function showLetter() {
      if (videoEnded) return;
      videoEnded = true;

      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }

      // Stop video
      const video = document.getElementById("player");
      try {
        video.pause();
        video.currentTime = 0;
      } catch (e) {}

      // Hide video, show letter
      document.getElementById("video-stage").style.display = "none";
      document.getElementById("letter-stage").classList.add("active");
    }
  </script>
</body>
</html>
