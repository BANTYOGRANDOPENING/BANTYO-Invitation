<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAN-TYO Invitation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Georgia", "Times New Roman", serif;
      overflow: hidden;
      position: relative;
      background: #0a0a12;
    }

    /* Background image with 85% opacity */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("Digimon_Profile_Report_002_b.webp") center center / cover no-repeat;
      opacity: 0.85;
      z-index: 0;
    }

    /* Dark overlay to make envelope stand out */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    /* ===== ENVELOPE STAGE ===== */
    #envelope-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s ease;
      position: relative;
    }

    #envelope-stage.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
    }

    .hint {
      color: rgba(255, 255, 255, 0.92);
      font-size: 1.15rem;
      letter-spacing: 3px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .envelope {
      width: 340px;
      height: 220px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.7));
    }

    .envelope:hover {
      transform: scale(1.05) translateY(-6px);
    }

    .envelope:active {
      transform: scale(0.97);
    }

    /* Black envelope body */
    .env-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 155px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
      border-radius: 0 0 10px 10px;
      border: 2px solid #333;
      overflow: hidden;
    }

    .env-body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
    }

    /* Black envelope flap */
    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      clip-path: polygon(0 0, 50% 72%, 100% 0);
      border: 2px solid #444;
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .envelope.open .env-flap {
      transform: rotateX(180deg);
    }

    /* BAN-TYO Logo as seal */
    .seal {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
      overflow: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease;
      border: 2px solid rgba(255, 215, 0, 0.5);
      background: #000;
    }

    .seal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .envelope.open .seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.4);
    }

    /* ===== VIDEO STAGE ===== */
    #video-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      background: #000;
    }

    #video-stage.active {
      display: flex;
    }

    .video-wrapper {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .countdown {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.55);
      padding: 10px 24px;
      border-radius: 24px;
      z-index: 20;
    }

    /* ===== LETTER STAGE ===== */
    #letter-stage {
      display: none;
      z-index: 30;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.8s ease;
    }

    #letter-stage.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .letter {
      background: linear-gradient(180deg, #fffef5 0%, #f8f0e0 100%);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 48px 40px;
      border-radius: 4px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(201,168,108,0.4);
      position: relative;
      animation: letterPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes letterPop {
      from { transform: scale(0.6) translateY(40px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .letter::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(201,168,108,0.35);
      pointer-events: none;
    }

    .letter-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .letter-header .ornament {
      font-size: 1.8rem;
      color: #c9a86c;
      margin-bottom: 8px;
    }

    .letter-header h1 {
      font-size: 1.6rem;
      color: #5c4033;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .letter-body {
      color: #4a3728;
      font-size: 1.05rem;
      line-height: 1.85;
      text-align: center;
    }

    .letter-body p {
      margin-bottom: 16px;
    }

    .letter-body .highlight {
      color: #8b4513;
      font-weight: bold;
      font-size: 1.15rem;
    }

    .letter-footer {
      margin-top: 32px;
      text-align: center;
      color: #7a5c45;
      font-style: italic;
      font-size: 0.95rem;
    }

    .letter-footer .signature {
      margin-top: 12px;
      font-size: 1.3rem;
      color: #5c4033;
      font-style: normal;
      font-family: "Brush Script MT", "Segoe Script", cursive;
    }

    @media (max-width: 480px) {
      .envelope {
        width: 290px;
        height: 190px;
      }
      .env-body {
        height: 135px;
      }
      .seal {
        width: 68px;
        height: 68px;
        top: 42px;
      }
      .letter {
        padding: 32px 24px;
      }
      .letter-header h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <!-- ===== STAGE 1: Envelope ===== -->
  <div id="envelope-stage">
    <p class="hint">點擊信封打開邀請函</p>
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="env-flap"></div>
      <div class="seal">
        <img src="ban-tyo-color-outline%20(3).png" alt="BAN-TYO" />
      </div>
      <div class="env-body"></div>
    </div>
  </div>

  <!-- ===== STAGE 2: Video (Fullscreen) ===== -->
  <div id="video-stage">
    <div class="video-wrapper">
      <video id="player" playsinline></video>
    </div>
    <div class="countdown" id="countdown">正在播放… 10 秒後顯示邀請信</div>
  </div>

  <!-- ===== STAGE 3: Letter ===== -->
  <div id="letter-stage">
    <div class="letter">
      <div class="letter-header">
        <div class="ornament">✦ ◆ ✦</div>
        <h1>邀請函</h1>
      </div>
      <div class="letter-body">
        <p>親愛的朋友，</p>
        <p>誠意邀請你參加一場特別的聚會。</p>
        <p class="highlight">【活動詳情待定】</p>
        <p>日期：待定<br>
           時間：待定<br>
           地點：待定</p>
        <p>期待與你見面！</p>
      </div>
      <div class="letter-footer">
        <p>此致</p>
        <p class="signature">敬上</p>
      </div>
    </div>
  </div>

  <script>
    const PLAY_SECONDS = 10;
    let countdownInterval = null;
    let videoEnded = false;

    function openEnvelope() {
      const envelope = document.getElementById("envelope");
      envelope.classList.add("open");

      setTimeout(() => {
        document.getElementById("envelope-stage").classList.add("hidden");
        startVideo();
      }, 900);
    }

    function startVideo() {
      const videoStage = document.getElementById("video-stage");
      videoStage.classList.add("active");

      const video = document.getElementById("player");
      video.src = "braveheart_10s.mp4";
      video.muted = false;
      video.playsInline = true;

      // Try to enter fullscreen
      const requestFS = () => {
        const el = videoStage;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
          el.msRequestFullscreen();
        }
      };

      video.onloadeddata = function () {
        video.play().then(() => {
          setTimeout(requestFS, 300);
        }).catch(function () {
          startCountdown();
        });
        startCountdown();
      };

      video.onended = function () {
        showLetter();
      };

      video.onerror = function () {
        document.getElementById("countdown").textContent = "影片載入失敗，即將顯示邀請信…";
        setTimeout(showLetter, 1500);
      };
    }

    function startCountdown() {
      if (countdownInterval) return;
      let remaining = PLAY_SECONDS;
      const countdownEl = document.getElementById("countdown");
      countdownEl.textContent = `正在播放… ${remaining} 秒後顯示邀請信`;

      countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          showLetter();
        } else {
          countdownEl.textContent = `正在播放… ${remaining} 秒後顯示邀請信`;
        }
      }, 1000);
    }

    function showLetter() {
      if (videoEnded) return;
      videoEnded = true;

      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else if (document.webkitFullscreenElement) {
        document.webkitExitFullscreen();
      }

      const video = document.getElementById("player");
      try {
        video.pause();
        video.currentTime = 0;
      } catch (e) {}

      document.getElementById("video-stage").style.display = "none";
      document.getElementById("letter-stage").classList.add("active");
    }
  </script>
</body>
</html>
